# Managed as one exact include inside the protected-staging TLS server.
location = /prd-studio {
    return 308 /prd-studio/;
}

location /prd-studio/ {
    access_log off;
    auth_basic "Protected staging";
    auth_basic_user_file /etc/nginx/protected-staging.htpasswd;
    limit_req zone=prd_studio_auth burst=20 nodelay;
    client_max_body_size 1040k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-PRD-Authenticated 1;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_pass http://unix:/run/prd-studio/http.sock:;
}
