# prd.manifest.yaml — machine-readable index of a Living PRD bundle (standard v1.2)
# Downstream AI agents read this FIRST. Schema: schema/prd.manifest.schema.json
# Validate with: bin/validate.py <bundle-dir>
# Placeholder convention: quoted "<...>" strings must be replaced; the validator flags any that remain.

prd:
  id: "<feature-slug>"                # e.g. axis-rewards-v1 (lowercase, hyphens)
  title: "<one line>"
  owner: "<pm-name>"
  tech_lead: "<name>"                 # G2 reviewer, G4 signatory
  qa: "<name>"                        # G2 reviewer, G4 signatory, G6 owner
  designer: "<name or none>"
  tier: T1                            # T1 | T2 | T3
  status: framing                     # framing | building | alpha-review | bundle-assembly | frozen | in-build | reconciled | shipped | archived
  standard_version: "1.2"

pinned_versions:                      # pin what the bundle was built on
  build_framework: "<repo ref / commit SHA>"
  slim_scaffold: "<version, T2 only, or n/a>"
  sanctioned_fork: "<fork ref + refresh date, T3 only, or n/a>"

mandate:                              # when the full process is required (see PROCESS.md)
  mandatory: null                     # true | false — set at G0
  triggers: []                        # any of: regulated-data, payments-kyc-pii, complex-state-machine, irreversible-actions, cross-team
  opt_out: "n/a"                      # "<date + name>" only valid when triggers is empty; re-enters at G2 if a trigger appears later

prototype:
  kind: single-file-html              # single-file-html | standalone-app | codebase-fork
  entry: "<URL, repo+branch, or file path>"
  run: "<exact command, or open file>"   # a cold session must be able to start it from this line alone
  base: "n/a"                         # T3 only — sanctioned-fork point (repo, branch, SHA, refresh date)

data:
  provenance: synthetic               # synthetic (default) | hardcoded | staging-dump
  # staging-dump is GATED: allowed only through the documented scrub pipeline, all three fields below required.
  dump_date: "n/a"
  scrub_pipeline: "n/a"               # pipeline name + version that produced the scrubbed dump
  pii_scrubbed: null                  # set true ONLY after the pipeline run is attested; there is no safe default

# Fidelity map — every surface, API call, and data path. Nothing unlabeled.
# REAL = real/staging systems, authoritative | MOCKED = mock with contract in MOCKS.md | STATIC = visual only
fidelity:
  - path: "<screen/flow/API — e.g. plan-configurator pricing>"
    label: STATIC                 # REAL | MOCKED | STATIC
    note: "<one line>"

coverage_plan:                        # agreed at G2 Alpha Review; scenario IDs persist through production and reconcile
  agreed_at: "pending"                # date when agreed
  scenarios:
    - id: S1
      name: "<one line>"
      status: pending                 # pending | demonstrable | not-demonstrable
      not_demonstrable_reason: "n/a"  # required when status is not-demonstrable — see STANDARD §5 for the three allowed categories
      links:                          # traceability — filled as the bundle matures; validator checks at G4
        spec: "SPEC.md#<section>"
        events: []                    # event names from TRACKING.md
        mocks: []                     # mock IDs from MOCKS.md, if any
        evidence: "<EVIDENCE/ file or pending>"
        production_ref: "pending"     # PR/ticket once in build
        reconcile: "pending"          # pass | deviation-approved | pending

artifacts:                            # status: missing | draft | complete
  spec: { file: SPEC.md, status: missing }
  tracking: { file: TRACKING.md, status: missing }
  mocks: { file: MOCKS.md, status: missing }
  decisions: { file: DECISIONS.md, status: missing }
  handoff: { file: HANDOFF.md, status: missing }
  evidence: { dir: EVIDENCE/, status: missing }
  contracts: { dir: contracts/, status: missing }   # pinned OpenAPI/JSON Schema + fixtures; outranks SPEC for API shapes

gates:
  g0_frame: { passed: "pending", by: "" }
  g1_solution: { passed: "pending", by: "" }
  g2_alpha_review: { passed: "pending", tech_lead: "", qa: "", coverage_plan: "pending" }
  g3_bundle_complete: { passed: "pending", by: "" }
  g4_freeze: { passed: "pending" }    # see release block — three signatures
  g5_productionise: { passed: "pending", by: "" }
  g6_reconcile: { passed: "pending", by: "" }

release:                              # the immutable Handoff Release created at G4; a material change creates a NEW release
  release_id: "pending"               # prd-<slug>-r<NN>, e.g. prd-axis-rewards-r1
  frozen: "pending"                   # date when frozen
  prototype_commits: []               # exact SHAs (file hash for single-file T1)
  figma_versions: []                  # snapshot links/ids, or empty
  api_contracts: []                   # contracts/ files + versions pinned, or empty
  evidence_tag: "pending"             # git tag name; protect the prd/* tag pattern in repo settings
  digest: "pending"                   # sha256 over the pinned refs + approvals — computed by bin/freeze.py
  approvals:                          # recorded here AND as GitHub reviews (CODEOWNERS) — GitHub is the enforcing copy
    pm_intent_behaviour: { by: "", date: "pending" }
    tech_feasibility_delta: { by: "", date: "pending" }
    qa_coverage_testability: { by: "", date: "pending" }
  supersedes: "n/a"                   # previous release_id, if any

cold_session:                         # adversarial completeness check — REQUIRED for G4, NOT sufficient: the three human signatures decide
  passed: "pending"
  transcript: "EVIDENCE/cold-session-<date>.md"
  open_defects: -1                    # unanswered questions at last run; must be 0 at freeze (-1 = not yet run)

changelog:
  - date: "<YYYY-MM-DD>"
    change: "<what changed in the bundle>"
    reason: "<decision closed / prototype-spec disagreement (which won) / scope change / reopened approval>"
